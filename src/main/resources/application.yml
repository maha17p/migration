server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/migration
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history
    placeholder-replacement: true
    clean-disabled: true

